name: Build RUTOR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android CDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q Rutor-Android.zip -d source

      - name: Fix Java compatibility
        run: |
          cat >> source/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Fix Kotlin singleLine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/app/src/main/java/com/rutor/nativeapp/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          if "singleLine = true" not in s:
              raise SystemExit("Expected singleLine setting not found")
          s = s.replace("singleLine = true", "maxLines = 1")
          p.write_text(s, encoding="utf-8")
          PY
            - name: Build APK
        working-directory: source
      - run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUTOR-Android-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
